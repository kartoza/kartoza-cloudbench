# Standalone MinIO (S3-compatible storage) for this sandbox server.
#
# sandbox.kartoza.com is reverse-proxied by nginx to 127.0.0.1:9000 as a pure
# S3 API endpoint (presigned URLs, SDK calls from the app).
#
# Ports are published on 127.0.0.1 only, so MinIO is NOT reachable from the
# internet except through that nginx proxy. Do not change to 0.0.0.0.
#
# Attached to the deployment_default network so the dockerized Django
# backend can reach it at http://minio:9000 for S3 connections created
# in-app, in addition to the host-published localhost port.
#
# Console/dashboard (port 9001, loopback-only, NOT proxied by nginx): reach
# it via an SSH tunnel or VS Code port forward, e.g.
#   ssh -L 9001:localhost:9001 <user>@<this-host>
# then open http://localhost:9001 and log in with the root credentials
# below. A stray plain-browser hit to sandbox.kartoza.com (no S3 auth
# headers) will 302-redirect to this port, which only resolves over the
# tunnel — that's expected and harmless for real S3/API traffic.
#
# Usage (from this directory):
#   docker compose -f docker-compose.minio.yml --env-file .env up -d

version: '3.9'

networks:
  default:
    name: deployment_default
    external: true

volumes:
  cloudbench-minio-data:

services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: cloudbench-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: https://sandbox.kartoza.com
    volumes:
      - cloudbench-minio-data:/data
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
