# CloudNativeGIS Processing (formerly "Lite"): standalone, database-free
# PMTiles/GeoParquet/COG conversion service used by CloudBench's S3 upload
# flow (apps/s3/pmtiles.py, cog.py).
# Image is built from CloudNativeGIS/processing/ — see that directory's README
# for the API. It holds real S3 credentials, so it must never be exposed
# publicly regardless of LITE_API_TOKEN below: port bound to 127.0.0.1 only.
#
# Reachable from the dockerized Django backend at http://cng-lite:8000; from
# a host-run Django (e.g. via VSCode) at http://127.0.0.1:8000 — point
# CLOUDNATIVEGIS_URL at whichever applies.
#
# Build a local image from the working tree (from repo root), or use a
# released ghcr.io/kartoza/cloudnativegis-processing tag instead:
#   docker build -t cloudnativegis-processing:latest CloudNativeGIS/processing/
#
# Usage (from this directory):
#   docker compose -f docker-compose.cng-lite.yml --env-file .env up -d

version: '3.9'

networks:
  default:
    name: deployment_default
    external: true

services:
  cng-lite:
    image: cloudnativegis-processing:latest
    container_name: cloudbench-cng-lite
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_ADDRESSING_STYLE: path
      # Shared with Django's CLOUDNATIVEGIS_API_TOKEN — see .env. Left
      # blank, no auth is enforced (see app/auth.py).
      LITE_API_TOKEN: ${CLOUDNATIVEGIS_API_TOKEN:-}
    ports:
      - "127.0.0.1:${CLOUDNATIVEGIS_LITE_PORT:-8100}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
