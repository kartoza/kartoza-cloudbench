# Stands in for GeoHosting's ingress-nginx in front of CloudBench
# (kartoza-devops: argocd/prd/argocd-bootstrap/apps/ktz/geohosting/overlays/prd/k8s/resources/ingress.yaml,
# cloudbench-ing): its one annotation, proxy-body-size: 2G, and ingress-nginx's
# defaults for everything else.
server {
    listen 80;

    # nginx.ingress.kubernetes.io/proxy-body-size: 2G
    client_max_body_size 2G;

    # ingress-nginx defaults: request bodies are buffered (each 5 MB chunk
    # lands in nginx before it's passed on), 60 s read/send timeouts.
    proxy_request_buffering on;
    proxy_buffering on;
    client_body_buffer_size 8k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_http_version 1.1;

    location / {
        proxy_pass http://cloudbench:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
