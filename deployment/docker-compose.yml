version: '3.9'

volumes:
  cloudbench-folder:

services:
  django:
    image: ghcr.io/kartoza/kartoza-cloudbench:${CLOUDBENCH_TAG:-latest}
    env_file: .env
    environment:
      CLOUDNATIVEGIS_URL: ${CLOUDNATIVEGIS_URL:-http://cloudnativegis-processing:8000}
      CLOUDNATIVEGIS_API_TOKEN: ${CLOUDNATIVEGIS_API_TOKEN:-}
    depends_on:
      - cloudnativegis-processing
    volumes:
      - cloudbench-folder:${CLOUDBENCH_DATA_FOLDER:-/home/web/cloudbench_data}
    ports:
      - "${HTTP_PORT:-8000}:8000"
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  cloudnativegis-processing:
    image: ghcr.io/kartoza/cloudnativegis-processing:${CLOUDNATIVEGIS_PROCESSING_TAG:-0.0.2}
    restart: on-failure
    environment:
      - LITE_API_TOKEN=${CLOUDNATIVEGIS_API_TOKEN:-}
      - LITE_MAX_DOWNLOAD_SIZE=${CLOUDNATIVEGIS_MAX_DOWNLOAD_SIZE:-524288000}
