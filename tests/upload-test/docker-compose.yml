# CloudBench as GeoHosting runs it in production, with this branch's code, to
# test uploads by hand (see TEST_GUIDE_s3_upload_passthrough.md here).
#
#   cd tests/upload-test
#   docker compose up -d --build     # then open http://localhost:8000 (admin / admin)
#   docker compose logs -f cloudbench
#   docker compose down -v           # stop, and drop the test data
#
# Mirrors kartoza-devops argocd/prd/argocd/apps/ktz/geohosting/deployments/cloudbench-deployment.yaml:
# production settings, 4 gunicorn workers (gthread, from the image's gunicorn
# config), the data folder on its own volume (the PVC there), behind an
# ingress-like nginx. Left out: GeoHosting SSO and on-demand conversion
# servers, which uploads don't use.
name: cloudbench-upload-test

services:
  cloudbench:
    build:
      context: ../..
      dockerfile: tests/upload-test/Dockerfile
    image: cloudbench-upload-test:local
    environment:
      DJANGO_SETTINGS_MODULE: cloudbench.settings.production
      CLOUDBENCH_DATA_FOLDER: /home/web/cloudbench_data
      GUNICORN_WORKERS: "4"
      SECURE_SSL_REDIRECT: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:8000
      # Test-only values: this stack never leaves your machine.
      DJANGO_SECRET_KEY: cloudbench-upload-test-only
      CLOUDBENCH_ENCRYPTION_KEY: ycAmz9zcodfzuIBb0QTqkRDEBYFxXCvIpMij7sXv6mc=
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      # No CloudNativeGIS here: skips the entrypoint's start-up check.
      CLOUDNATIVEGIS_URL: ""
    volumes:
      - cloudbench-data:/home/web/cloudbench_data
    restart: on-failure

  ingress:
    image: nginx:1.29
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8000:80"
    depends_on:
      - cloudbench

volumes:
  cloudbench-data:
