# Standalone MinIO stack for testing Kartoza CloudBench's S3 provider
# (apps/s3). Not part of deployment/docker-compose.yml, but attached to its
# default network (deployment_default) so the dockerized backend
# (deployment-dev-1) can reach it — that container's "localhost" is itself,
# not the host, so a host-published port alone isn't reachable from there.
#
# Quick start (from this directory):
#   make up      # start MinIO + create the default bucket
#   make creds   # print the values to paste into the "Add S3 Connection" dialog
#
# From a PyCharm-run/host backend, use localhost:9000.
# From the dockerized backend (deployment-dev-1), use
# kartoza-s3-test-minio:9000 (note: API port 9000, not the console port 9001).

services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: kartoza-s3-test-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - s3-test-minio-data:/data
    networks:
      - s3-test-net
      - deployment_default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Creates the default test bucket once MinIO is healthy, then exits.
  minio-setup:
    image: quay.io/minio/mc:latest
    container_name: kartoza-s3-test-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/${MINIO_DEFAULT_BUCKET:-geospatial-data};
      echo 'Bucket ready: ${MINIO_DEFAULT_BUCKET:-geospatial-data}';
      exit 0;
      "
    networks:
      - s3-test-net

networks:
  s3-test-net:
    driver: bridge
  deployment_default:
    external: true

volumes:
  s3-test-minio-data:
    name: kartoza-s3-test-minio-data
